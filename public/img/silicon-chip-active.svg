    <path d="M0 -18 C1.0 -8 3.5 -3 13 0 C3.5 3 1.0 8 0 18 C-1.0 8 -3.5 3 -13 0 C-3.5 -3 -1.0 -8 0 -18 Z" fill="#ffffff"/>
