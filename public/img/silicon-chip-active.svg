    <rect x="970" y="700" width="110" height="90" rx="8"/>
    <rect x="1100" y="700" width="110" height="90" rx="8"/>
  </g>

  
  <g fill="#ffc285" opacity="0.8">
    <circle cx="765" cy="335" r="8"/><circle cx="895" cy="335" r="8"/><circle cx="1025" cy="335" r="8"/><circle cx="1155" cy="335" r="8"/>
    <circle cx="765" cy="745" r="8"/><circle cx="895" cy="745" r="8"/><circle cx="1025" cy="745" r="8"/><circle cx="1155" cy="745" r="8"/>
