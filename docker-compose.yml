version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongodb_data:/data/db

  vpanel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vpanel-pro
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "3001:3001"          # Web Management Panel
      - "3002:3002"          # REST API & Socket.IO
      - "25501-25600:25501-25600" # VM SSH & Port Forwarding Range
    volumes:
      - ./vms:/app/vms
      - ./uploads:/app/uploads
      - ./storage/logs:/app/storage/logs
    environment:
      NODE_ENV: production
      PANEL_PORT: 3001
      API_PORT: 3002
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      MONGO_URI: mongodb://admin:${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}@mongodb:27017/vpanel?authSource=admin
      NO_KVM: 1
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@siliconhost.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined

volumes:
  mongodb_data:
