<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    
    <radialGradient id="bgGradActive" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1e130c"/>
      <stop offset="45%" stop-color="#120c08"/>
      <stop offset="75%" stop-color="#0a0705"/>
      <stop offset="100%" stop-color="#050302"/>
    </radialGradient>

    
    <linearGradient id="substrateGradActive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1a12"/>
      <stop offset="50%" stop-color="#1a110c"/>
      <stop offset="100%" stop-color="#0f0906"/>
    </linearGradient>

    
    <linearGradient id="heatSpreaderActive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d2214"/>
      <stop offset="30%" stop-color="#26150b"/>
      <stop offset="70%" stop-color="#1b0e07"/>
      <stop offset="100%" stop-color="#341b0e"/>
    </linearGradient>

    
    <linearGradient id="goldCopperActive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb87a"/>
      <stop offset="40%" stop-color="#ff7f2e"/>
      <stop offset="80%" stop-color="#cf5f1b"/>
      <stop offset="100%" stop-color="#9a3e0b"/>
    </linearGradient>

    
    <radialGradient id="corePlasma" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ffbe80"/>
      <stop offset="60%" stop-color="#ff731d"/>
      <stop offset="90%" stop-color="#b84a0d"/>
      <stop offset="100%" stop-color="#4a1a03"/>
    </radialGradient>

    
    <pattern id="siliconGridActive" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 140, 50, 0.22)" stroke-width="1"/>
      <circle cx="20" cy="20" r="1.8" fill="rgba(255, 175, 100, 0.35)"/>
    </pattern>

    
    <pattern id="pcbLinesActive" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M0 60 H40 L60 80 H120 M60 0 V40 L80 60 V120" fill="none" stroke="rgba(255, 130, 40, 0.12)" stroke-width="1.5"/>
    </pattern>

    
    <filter id="neonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  
  <rect width="1920" height="1080" fill="url(#bgGradActive)"/>
  <rect width="1920" height="1080" fill="url(#pcbLinesActive)"/>

  
  <circle cx="960" cy="540" r="560" fill="url(#corePlasma)" opacity="0.18" filter="url(#intenseGlow)"/>

  
  <g stroke="#ff8533" stroke-width="2.5" fill="none" stroke-linecap="round" filter="url(#neonBloom)">
    
