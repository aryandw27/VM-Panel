  <text x="960" y="582" text-anchor="middle" font-family="'Onest', sans-serif" font-weight="700" font-size="12" letter-spacing="4" fill="#ffb87a">QUANTUM CLOUD ARCHITECTURE &bull; MODEL SH-9950X</text>

  
